name: unit-tests

# Runs the HealthSyncTests unit-test bundle on an iOS simulator. No real
# HealthKit data is needed: HTTP is stubbed via URLProtocol and HealthKit is
# behind protocols with test fakes.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick an available iPhone simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          echo "Using simulator $UDID"

      - name: Run unit tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project HealthSync.xcodeproj \
            -scheme HealthSync \
            -destination "id=$SIM_UDID"
