name: HealthSync
options:
  bundleIdPrefix: com.cjwillin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
targets:
  HealthSync:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - sdk: HealthKit.framework
    info:
      path: SupportFiles/Info.plist
      properties:
        CFBundleDisplayName: Health Sync
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: >-
          Health Sync reads your steps, heart rate, sleep and workouts to show
          your day and sync it to your own private ingest server. Health data
          never goes anywhere else.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: SupportFiles/HealthSync.entitlements
      properties:
        com.apple.developer.healthkit: true
  HealthSyncTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/HealthSyncTests
    dependencies:
      - target: HealthSync
      - sdk: HealthKit.framework
schemes:
  HealthSync:
    build:
      targets:
        HealthSync: all
        HealthSyncTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - HealthSyncTests
